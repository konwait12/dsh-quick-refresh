name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"

      - name: Check lib files exist
        run: |
          test -f lib/index.js
          test -f lib/client.js
          test -f cordis.patch.yml
          echo "lib files ok"

      - name: Basic ESM import check
        run: node --input-type=module -e "import('./lib/index.js').then(()=>console.log('host import ok')).catch(e=>{console.error(e);process.exit(1)})"

      - name: Client bundle syntax check
        run: node --check lib/client.js
